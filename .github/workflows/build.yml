name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kelp
        uses: actions/checkout@v4
        with:
          path: kelp

      - name: Checkout companion light-sdk
        uses: actions/checkout@v4
        with:
          repository: LooseWireDev/light-sdk
          ref: codex/kelp-official-sdk
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug assemble
        working-directory: kelp
        run: ./gradlew :protocol:test :app:testDebugUnitTest :server:testDebugUnitTest :app:assembleDebug
