name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kelp
        uses: actions/checkout@v4
        with:
          path: kelp

      - name: Checkout companion light-sdk
        uses: actions/checkout@v4
        with:
          repository: LooseWireDev/light-sdk
          ref: codex/kelp-official-sdk
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches app version
        run: |
          version="$(awk -F'"' '/^versionName *=/ {print $2; exit}' kelp/app/lighttool.toml)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName v$version in app/lighttool.toml"
            exit 1
          fi

      - name: Decode signing key
        run: echo "$TIDE_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tide-release.jks"
        env:
          TIDE_RELEASE_KEYSTORE_B64: ${{ secrets.TIDE_RELEASE_KEYSTORE_B64 }}

      - name: Verify TIDAL developer configuration
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SCOPES: ${{ secrets.TIDAL_CLIENT_SCOPES }}
          TIDAL_CLIENT_REDIRECT_URI: ${{ secrets.TIDAL_CLIENT_REDIRECT_URI }}
        run: |
          if [ -z "$TIDAL_CLIENT_ID" ] || [ -z "$TIDAL_CLIENT_SCOPES" ] || [ -z "$TIDAL_CLIENT_REDIRECT_URI" ]; then
            echo "Missing one or more TIDAL developer configuration secrets"
            exit 1
          fi

      - name: Build release APK
        working-directory: kelp
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SCOPES: ${{ secrets.TIDAL_CLIENT_SCOPES }}
          TIDAL_CLIENT_REDIRECT_URI: ${{ secrets.TIDAL_CLIENT_REDIRECT_URI }}
          TIDE_RELEASE_KEYSTORE: ${{ runner.temp }}/tide-release.jks
          TIDE_RELEASE_STORE_PASSWORD: ${{ secrets.TIDE_RELEASE_STORE_PASSWORD }}
          TIDE_RELEASE_KEY_ALIAS: ${{ secrets.TIDE_RELEASE_KEY_ALIAS }}
          TIDE_RELEASE_KEY_PASSWORD: ${{ secrets.TIDE_RELEASE_KEY_PASSWORD }}
        run: scripts/build-release.sh

      - name: Verify release catalog configuration
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SCOPES: ${{ secrets.TIDAL_CLIENT_SCOPES }}
          TIDAL_CLIENT_REDIRECT_URI: ${{ secrets.TIDAL_CLIENT_REDIRECT_URI }}
        run: |
          set -euo pipefail
          umask 077
          dex_blob="$RUNNER_TEMP/kelp-release.dex"
          pattern_file="$RUNNER_TEMP/kelp-catalog-config.pattern"
          trap 'rm -f "$dex_blob" "$pattern_file"' EXIT
          unzip -p kelp/dist/*.apk 'classes*.dex' > "$dex_blob"
          for variable in TIDAL_CLIENT_ID TIDAL_CLIENT_SCOPES TIDAL_CLIENT_REDIRECT_URI; do
            printf '%s\n' "${!variable}" > "$pattern_file"
            if ! grep -aFq -f "$pattern_file" "$dex_blob"; then
              echo "Release APK is missing $variable"
              exit 1
            fi
          done
          echo "Release APK catalog configuration verified"

      - name: Signer digest + checksums + notes
        run: |
          apk="$(ls kelp/dist/*.apk)"
          certs="$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$apk" 2>/dev/null \
            | grep -E '^\s*Signer #1 certificate (SHA-256|SHA-1)')"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          echo "$sha" $(basename "$apk") > kelp/dist/checksums.txt
          {
            echo "Install or upgrade on a Light Phone III with adb: \`adb install -r $(basename "$apk")\`."
            echo
            echo "APK SHA-256: \`$sha\`"
            echo
            echo "Signer certificate SHA-256: \`$(echo "$certs" | awk -F': ' '/SHA-256/ {print $2}')\`"
            echo
            echo "Requires a paid TIDAL subscription and the two-step sign-in (catalog, then playback). See README for details."
          } > kelp/dist/release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kelp ${{ github.ref_name }}
          body_path: kelp/dist/release-notes.txt
          files: |
            kelp/dist/*.apk
            kelp/dist/checksums.txt
          generate_release_notes: true
